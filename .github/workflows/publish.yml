name: Verified public calendar relay
on:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-calendar-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify frozen public package and extract
        run: |
          echo '793e547b587e174c5e4bc2463ade59e272d65a921c1d0357e32eab0e29d5491e  public_calendar_relay.zip' | sha256sum -c -
          unzip -oq public_calendar_relay.zip
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - name: Retrieve and independently validate official public sources
        run: python -B relay_core.py --output public
      - name: Record public provenance heartbeat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pointer=json.loads(Path('public/latest.json').read_text())
          Path('public_refresh_provenance.json').write_text(json.dumps(pointer,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public_refresh_provenance.json
          git commit -m 'Record verified public calendar refresh'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
