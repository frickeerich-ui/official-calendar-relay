name: Verified public calendar relay
on:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      runner_os:
        description: 'Official-source retrieval runner'
        type: choice
        default: ubuntu-24.04
        options: [ubuntu-24.04, windows-2022]
      verified_bootstrap:
        description: 'Publish the independently verified one-time official-source bootstrap (original timestamps; age <=36h)'
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-calendar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.runner_os || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify frozen public package and extract
        run: |
          python - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          p=Path('public_calendar_relay_v2.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='be9f25d34a2e82a5319459bcb6a4da8188915fc5deee1182cdccc06643e1e44a'
          with zipfile.ZipFile(p) as archive: archive.extractall()
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt tzdata==2026.6
      - run: python -m playwright install --with-deps chromium
        if: ${{ !inputs.verified_bootstrap }}
      - name: Use standard visible browser transport on Windows
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('cloud_refresh.py')
          data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest()=='6f60fba943dd1e68dd618ca9a1aeb4123a910526edcbaecf24ed73199a2041e5'
          text=data.decode('utf-8')
          assert text.count('launch(headless=True)')==1
          text=text.replace('launch(headless=True)','launch(headless=False)')
          anchor='        page=self.context.new_page();responses=[]'
          assert text.count(anchor)==1
          text=text.replace(anchor,anchor+"\n        page.route('**/*',lambda route:route.continue_() if route.request.method=='GET' and route.request.url==url else route.abort())")
          compile(text,str(p),'exec')
          p.write_bytes(text.encode('utf-8'))
          print('Reviewed public browser transport source SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - run: python -B -m unittest discover -s tests -v
      - name: Retrieve and independently validate official sources
        if: ${{ !inputs.verified_bootstrap }}
        run: python -B cloud_refresh.py --output public
      - name: Explicit one-time independently verified bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_bootstrap }}
        run: python -B cloud_refresh.py --output public --verified-bootstrap verified_bootstrap
      - name: Record public provenance heartbeat
        run: |
          cp public/latest.json public_refresh_provenance.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public_refresh_provenance.json
          git diff --cached --quiet || git commit -m 'Record verified public calendar refresh'
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
